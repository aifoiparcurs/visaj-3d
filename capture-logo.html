<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visaj logo capture</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1b1732;
      }

      body {
        background:
          radial-gradient(ellipse 95% 58% at 50% -8%, rgba(167, 139, 250, 0.24), transparent 56%),
          radial-gradient(ellipse 70% 50% at 0% 0%, rgba(129, 111, 255, 0.16), transparent 52%),
          radial-gradient(ellipse 68% 48% at 100% 2%, rgba(196, 181, 253, 0.16), transparent 50%),
          radial-gradient(ellipse 100% 52% at 50% 108%, rgba(139, 92, 246, 0.12), transparent 58%),
          linear-gradient(180deg, #1b1732 0%, #1a1833 52%, #19192d 100%);
      }

      #visaj-stage {
        width: 100vw;
        height: 100vh;
      }

      #visaj-stage canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="visaj-stage"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
